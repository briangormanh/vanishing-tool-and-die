<script type="application/json" id="doc">{"auto_source_checks": true, "asset": {"title": "Reshoring's Missing Piece: America's Vanishing Tool & Die Makers", "client": "Westlake Tool & Die (Avon, Ohio)", "slug": "reshoring-tool-die-makers", "page": "../index.html", "built": "2026-07-01", "money_page": "https://westlaketool.com/capabilities/metal-stamping/", "one_paragraph": "The study says America is trying to bring factory work home at the same time as the trade that makes factory work possible is disappearing. It counts tool and die makers, the skilled workers who build the dies and molds that shape metal parts, and finds the national workforce fell from 75,950 in 2014 to 55,130 in 2024, a drop of about 27 percent. It then ranks every state that reports the trade, and shows that Ohio, second-largest in the country, lost a larger share of its tool and die workforce over that decade than any other big state, about 42 percent. On top of that it estimates that roughly 55 percent of the people left are 55 or older, so a large share of what remains is close to retiring. The argument the piece makes is that this shrinking, aging trade is the bottleneck for reshoring, not a shortage of factories or of money.", "load_bearing_number": {"label": "The decade decline in tool and die makers nationally", "value": "-27.4% (75,950 in 2014 to 55,130 in 2024)", "field": "findings.json -> national.change_pct", "source": "BLS Occupational Employment and Wage Statistics, May 2014 and May 2024 national files, occupation code 51-4111. Both figures are re-derived from the frozen files by the build and asserted to match, so if either raw file is ever swapped the build fails rather than publishing a stale number. If this comparison is not legitimate, every headline in the piece falls with it."}}, "how_this_could_be_wrong": [{"risk": "BLS says plainly that this survey is not meant to be compared across years. Its own FAQ (item F.1) says it does not encourage using these figures for change over time, because the survey method, the collection, and the occupation coding have all changed. Our entire headline is a comparison across ten years of exactly that survey.", "why_we_think_it_holds": "The method section already says these are point-in-time estimates and not an official change statistic, and tells the reader to treat the decade figures as direction rather than an exact count. The size of the move also helps: a 27 percent national fall is far larger than survey noise, and it points the same way as the shop counts and the age profile. But this is a judgment, not a fact, and it is the first thing a labor economist or a careful reporter will raise.", "check": "C1"}, {"risk": "The study uses the May 2024 data, but BLS published May 2025 on 15 May 2026, six weeks before this piece was built. Anyone who clicks our own BLS source link today lands on May 2025 figures, which will not be the numbers on our page.", "why_we_think_it_holds": "We do not think it holds. This is the one we would most expect to get caught on, and we could not test it ourselves because BLS blocks automated access. It needs a human with a browser before this goes anywhere.", "check": "B5"}, {"risk": "Ohio's 42 percent decline is the sharpest of any large state, and Ohio is the client's own state. That is a convenient result for us. It could also be a coding or reclassification artifact rather than a real collapse, in which case the most quotable line in the piece is wrong.", "why_we_think_it_holds": "Ohio's fall shows up on both ends of the comparison and is large enough that a small reclassification would not produce it. Neighboring manufacturing states move the same direction, which is what a real regional decline looks like. But we did not inspect a year-by-year series for Ohio, because OEWS does not publish one cleanly, so we cannot rule out a step change in a single year.", "check": "C2"}, {"risk": "Every retirement figure in the piece, including the roughly 30,000 nationally and the roughly 3,000 for Ohio, comes from applying one national share (55 percent aged 55 or older) to each state. That share has no frozen source file in the folder, so the build cannot reproduce it, and the state-level split assumes every state has the same age mix.", "why_we_think_it_holds": "The page labels these as estimates and states the assumption in plain words in the method section. The direction is not in doubt, since the trade is unambiguously old. But the specific numbers rest on a figure nobody can currently re-derive from what is in the folder, and they are quoted as though they were counted.", "check": "C3"}], "checks": [{"id": "A1", "section": "Sources are real", "lane": "browser", "minutes": 8, "title": "The 7 source files are live, and they are the files we used", "where": "The table below, taken straight from findings.json. Every one of these was recorded as loading successfully on 2026-07-01 (Census re-verified 2026-08-25; BLS blocks scripts, see A3).", "do": "Open every file marked Primary, plus one other at random. Confirm each one downloads or displays a real data file, not a portal front page, a search screen, or a login. Then compare the file's own description of itself to how the study describes it: same geography, same years, same units, same definition of what is being counted. Last, check that the fingerprints shown on the published page match the ones in this table.", "pass": "Every file you opened is a real data file, it covers what the study says it covers, and the fingerprints on the page match this table.", "fail": "Any link is dead, needs a login, or lands on a front page. Or the file covers a different area, a different time period, or counts something other than what the study says. Or a fingerprint on the page does not match.", "table": {"columns": ["File", "What it was used for", "Fingerprint"], "rows": [[{"text": "BLS OEWS May 2024, state file (oesm24st.zip)", "url": "https://www.bls.gov/oes/special-requests/oesm24st.zip"}, "Primary. Workers, concentration and wages per state, SOC 51-4111.", "904b7d452be9"], [{"text": "BLS OEWS May 2014, state file (oesm14st.zip)", "url": "https://www.bls.gov/oes/special-requests/oesm14st.zip"}, "Primary. The 2014 half of every decade-change figure.", "bde46b6940ea"], [{"text": "BLS OEWS May 2024, national file (oesm24nat.zip)", "url": "https://www.bls.gov/oes/special-requests/oesm24nat.zip"}, "Primary. The 55,130 national worker count in the hero and gauge.", "a9bad3093703"], [{"text": "BLS OEWS May 2014, national file (oesm14nat.zip)", "url": "https://www.bls.gov/oes/special-requests/oesm14nat.zip"}, "Primary. The 75,950 baseline the 27.4% drop is measured from.", "b316e2bde932"], [{"text": "Census County Business Patterns 2023, state file (cbp23st.zip)", "url": "https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23st.zip"}, "Primary. Shop counts per state, NAICS 333514. Re-downloaded 2026-08-25, fingerprint unchanged.", "41a4c6161fb9"], [{"text": "Census County Business Patterns 2023, national file (cbp23us.zip)", "url": "https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23us.zip"}, "Supporting. The 1,976 national shop count.", "1d8dbbfa608a"], [{"text": "Tool & die shops per state, extracted from CBP 2023 (derived)", "url": "https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23st.zip"}, "Derived from the frozen CBP state file above. The build re-derives it from the raw file and asserts the totals match.", "f4bade38f167"]]}}, {"id": "A3", "section": "Sources are real", "lane": "browser", "minutes": 4, "title": "The links we could not load, one manual click each", "where": "The table below. These are pages a data brief would normally cite, but automated access was blocked, so we did not publish them. We do not link to anything we did not personally load.", "do": "Open each one in your own browser. They very likely work for a human. If a link loads and says what the last column claims, say so in your note and it gets added "do": "Run the checksum verification against the recorded manifest.", "command": "shasum -a 256 -c MANIFEST.sha256", "expected": "Ten lines, every one ending in OK.", "pass": "All ten lines say OK.", "fail": "Any line says FAILED. That means a raw input or a generated output has been altered since the build, and no number on the page can be trusted until it is explained.", "note": "Terminal checks need the full local asset folder, including data-sources/, which is not published to the web copy."}, {"id": "B4", "section": "Numbers on the page", "lane": "terminal", "minutes": 6, "title": "Re-download the Census file and confirm the agency has not revised it", "where": "The asset folder. Census allows automated access, so this one can be tested directly. BLS cannot, which is why it is a browser check instead (see B5).", "do": "Download the Census County Business Patterns 2023 state file again and compare its fingerprint to the frozen copy.", "command": "curl -sL -o /tmp/cbp_fresh.zip https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23st.zip && shasum -a 256 /tmp/cbp_fresh.zip | cut -d' ' -f1 && shasum -a 256 data-sources/cbp23st.zip | cut -d' ' -f1", "expected": "Two identical fingerprints, both starting 9fc306ec. They matched when this package was prepared on 2026-08-25.", "pass": "The two fingerprints are identical.", "fail": "They differ. That means Census has revised the 2023 data since we built, and the shop counts need rechecking before publication. It is not automatically an error in our work, but it must be understood rather than ignored.", "note": "Terminal checks need the full local asset folder, including data-sources/, which is not published to the web copy."}, {"id": "B5", "section": "Numbers on the page", "lane": "browser", "minutes": 15, "title": "Is our data the current data? Open BLS in a real browser and find out", "where": "bls.gov, in a browser. This check exists because BLS blocks automated requests, so nobody on the build side has been able to look. Treat it as the most important item in this package.", "do": "Open the BLS page for tool and die makers, linked below. Read which May year the page says it is showing. Our study used May 2024. Public reporting says BLS released May 2025 on 15 May 2026, which is before this asset was built. Write down the current national employment figure for occupation 51-4111 and compare it to our 55,130. Then decide, and say so in your note, whether the piece can honestly publish May 2024 figures while its own source link shows a newer year.", "pass": "Either the page still shows May 2024, in which case the study is on the current vintage and nothing needs to change. Or it shows May 2025 and you have recorded the new figure and made a clear recommendation about what to do.", "fail": "The page shows a newer year than ours and the piece still presents its numbers as the current picture without saying which vintage they are. Publishing that is how a reporter finds a discrepancy before we do.", "links": [{"label": "BLS, tool and die makers, current OEWS", "url": "https://www.bls.gov/oes/current/oes514111.htm"}, {"label": "BLS OEWS release table listing every May year", "url": "https://www.bls.gov/oes/tables.htm"}], "note": "If the answer is that May 2025 is now current, the practical options are to rebuild on the newer file, or to label every figure explicitly as May 2024 and say why. Recommend one. Do not leave it open."}, {"id": "C1", "section": "The story holds", "lane": "judgment", "minutes": 12, "title": "The leap: treating a point-in-time survey as a ten-year trend", "where": "The hero stat, the gauge, and the paragraph headed How we measured the decade change in the method section.", "do": "Read what BLS itself says about comparing these estimates over time, in FAQ item F.1, linked below. Then read our method section. Judge whether our wording is an honest warning or a formality a reader will skim past. The specific question: if a labor economist read only our method section, would they feel we had been straight with them?", "pass": "The caveat is stated in plain words, near the numbers it applies to, and it is strong enough that a reader understands the decade figures are a direction and not a measured change.", "fail": "The caveat is buried at the bottom, or hedged so lightly that the hero stat still reads as an official government change statistic. Also a fail if the piece uses words like fell, lost, or vanished in a way that implies a counted change rather than a difference between two estimates.", "links": [{"label": "BLS OEWS FAQ, see item F.1 on comparisons over time", "url": "https://www.bls.gov/oes/oes_ques.htm"}]}, {"id": "C2", "section": "The story holds", "lane": "judgment", "minutes": 12, "title": "Outlier forensics on Ohio, the number the whole pitch rests on", "where": "The Ohio section of the page, and the Ohio row in the leaderboard. Ohio is published as down about 42.4 percent, from 9,480 to 5,460.", "do": "Ohio's decline is the steepest of any large state, and Ohio is the client's state. Ask whether that is a real regional collapse or an artifact. Two things to weigh. First, do Ohio's neighbours move the same way? Michigan is down about 22 percent, Indiana about 28, Pennsylvania about 32, Illinois about 26. A real decline usually shows up across a region; an artifact usually does not. Second, a single-year step with nothing else moving with it would suggest workers were recoded into a different occupation rather than actually leaving. We could not inspect a year-by-year Ohio series, so this is a judgment call on the evidence available.", "pass": "You are satisfied the Ohio figure is a real decline, or you have identified a specific reason to doubt it and said what should change.", "fail": "Ohio moves sharply while every comparable state stays flat, or you find evidence of an occupational recoding in Ohio between 2014 and 2024. Either would mean the Ohio angle, which is the spine of the outreach plan, has to be softened or dropped.", "note": "This one matters more than its size suggests. Ohio being hardest hit is the hook in most of the Tier 1 pitches, so if it does not survive, the outreach packet changes too."}, {"id": "C3", "section": "The story holds", "lane": "judgment", "minutes": 10, "title": "The leap: one national age share applied to all 44 states", "where": "The retirement figures in the hero strip and the likely-to-retire column in the leaderboard, plus the paragraph headed How we estimated retirements.", "do": "Every retirement number is a state's current workforce multiplied by 0.55, the national share of tool and die makers aged 55 or older. Two things to judge. Is applying one national age share to every state fair, or does it invent state-level precision the data does not support? And separately, note that this 55 percent figure has no source file frozen in the folder, so the build cannot reproduce it. It is listed openly in findings.json under underived_figures. Decide whether a figure nobody can currently re-derive should be carrying a headline number.", "pass": "The estimate is clearly labeled as an estimate everywhere it appears, the assumption is stated near the number rather than only in the method section, and you are comfortable that a reader will not mistake it for a head count.", "fail": "Any retirement figure is presented as a count rather than an estimate, or a state-level figure implies we measured that state's ages when we did not. Also a fail if you conclude the missing PUMS extract has to be produced and frozen before this can be published.", "links": [{"label": "Census ACS Public Use Microdata, the stated source", "url": "https://www.census.gov/programs-surveys/acs/microdata.html"}]}, {"id": "C4", "section": "The story holds", "lane": "judgment", "minutes": 6, "title": "The robustness question: does the story survive a different ranking rule?", "where": "The leaderboard, and the claim that Ohio is second in the nation.", "do": "The "D1", "section": "Angle and framing", "lane": "judgment", "minutes": 8, "title": "Does the framing outrun the data?", "where": "The headline, the opening paragraph, and the section arguing that this trade is the bottleneck for reshoring.", "do": "The piece asserts a causal link: reshoring is constrained by the shrinking tool and die workforce. What the data actually shows is two things happening at once, a declining trade and announced reshoring jobs. Judge whether the page argues the connection or merely places the two facts next to each other and lets the reader assume. Then check the two supporting outside figures, roughly 500,000 unfilled manufacturing jobs and 244,000 reshoring jobs announced in 2024, and ask whether they are doing evidential work or decorative work.", "pass": "The causal claim is either supported or hedged to a claim about timing and pressure rather than proven cause.", "fail": "The page states or strongly implies that the tool and die decline is causing reshoring to stall, without evidence that connects them.", "note": "The 244,000 figure was confirmed on 2026-08-25 as still the most recent annual figure from the Reshoring Initiative; their 2025 report was listed as coming soon. The roughly 500,000 unfilled jobs figure comes from BLS JOLTS, which updates monthly, and is recorded in findings.json as not reproducible from any frozen file."}, {"id": "D2", "section": "Angle and framing", "lane": "judgment", "minutes": 10, "title": "Do the pitch angles claim more than the piece proves?", "where": "reshoring-tool-die-makers-outreach-packet.md, the section headed Data spine for hooks, and the per-tier pitch angles.", "do": "Read the hooks the team will actually send and compare each one to what the page can defend. Pay particular attention to the line offered as a scoop: that the widely repeated claim only 2 percent of tool and die makers are under 35 is wrong, and the real figure is about 13 to 15 percent. That correction rests on the same Census microdata that has no frozen file in this folder. Judge whether we should be pitching a correction to someone else's published statistic on the strength of a number we cannot currently reproduce.", "pass": "Every hook is supported by something on the page, and any hook resting on the microdata is either dropped or backed by an extract that gets frozen first.", "fail": "A pitch states as fact something the page hedges, or the under-35 correction goes out to reporters while its source cannot be reproduced. An accurate study can still become an inaccurate pitch, and the pitch is what the reporter quotes.", "links": [], "note": "The outreach packet is deliberately NOT published with this study, because it contains reporter email addresses. Ask for reshoring-tool-die-makers-outreach-packet.md directly; it sits in the same client folder as the study."}, {"id": "D3", "section": "Angle and framing", "lane": "browser", "minutes": 8, "title": "Can a reporter check our work from the page alone?", "where": "The published page, end to end.", "do": "Read the page as a reporter on deadline who has been asked to verify one number before quoting it. The method section and a linked source list are present. What is not present is a See for yourself section giving the exact steps to reach our figures in the agency's own tool, the file fingerprints, and a pointer to our most arguable claim. Judge how far a reporter gets with what is there, and whether that gap should be closed before this is pitched. Also confirm the share buttons work and that the embed snippet carries a real, visible, followable credit link to the client rather than only a bare frame.", "pass": "A reporter can reach at least one of our headline numbers from what the page gives them, and the embed carries a genuine credit link.", "fail": "The sources are named but a reporter cannot actually retrace a single figure, or the embed's credit link is missing, hidden, or marked so search engines ignore it, which would remove the entire SEO purpose of the asset.", "links": [{"label": "The money page the credit link points at", "url": "https://westlaketool.com/capabilities/metal-stamping/"}]}, {"id": "D4", "section": "Angle and framing", "lane": "judgment", "minutes": 10, "title": "The conflict-of-interest check: is this tilted toward the client's own turf?", "where": "The whole piece, read once more from the top, with this question only.", "do": "Westlake Tool & Die is an Ohio tool and die and metal stamping firm. The study happens to find that Ohio ranks second in the nation and was hit harder than any other large state, and it happens to conclude that the trade this client is in is the thing standing between America and a manufacturing revival. Ask directly: does Ohio lead because the data puts it there, or because the client is there? Would this piece have been written the same way, with the same ranking rule and the same emphasis, for a firm in Michigan, which is larger, or in Indiana, which is more concentrated? Nobody who built this can answer that honestly, which is why it is being asked of you.", "pass": "You are satisfied that the ordering, the emphasis, and the conclusion follow from the data, and that a competitor in another state would recognize the piece as fair.", "fail": "The client's state gets a dedicated section that other comparable states do not earn, or the ranking rule looks chosen to put Ohio high, or the reshoring conclusion reads as an advertisement for the client's own service line.", "note": "Answer this one in writing even if the answer is that it is fine. It is the check that protects the client relationship rather than the arithmetic, and a one-word pass is not useful."}], "confidence": {"dimensions": [{"name": "Is the data current?", "mark": "fail", "note": "No. We used the government's May 2024 figures. A newer release came out before this piece was even built, so anyone clicking our own source link sees different numbers than our page."}, {"name": "Do the numbers rebuild?", "mark": "check", "note": "Yes, and this part is strong. Every figure rebuilds from the saved files identically, every time. All 10 file checks pass. Nothing is typed in by hand."}, {"name": "Are we reading it right?", "mark": "part", "note": "Partly. The government says it does not recommend comparing these particular figures across years, and our headline does exactly that. We do say so on the page."}, {"name": "Does a second source agree?", "mark": "fail", "note": "Not on the part that matters. It agrees the trade is shrinking nationally. It disagrees sharply about Ohio, which is the whole pitch."}, {"name": "Does the angle hold up?", "mark": "fail", "note": "No. Ohio is 19% down on the reliable measure, sitting between Michigan at 16% and Pennsylvania at 20%. There is no Ohio story."}], "critic_could_land": ["Ohio's drop is less than half what we claim in a second government dataset, and checking it takes one lookup.", "Ohio is not an outlier at all on the steadier measure. It sits mid-pack among its neighbors.", "Our own source link shows a newer year than the numbers on our page.", "The retirement figures rest on a statistic we never saved a copy of, so nobody can check them, including us."], "recommendation": "Do not proceed", "why": "Our headline says Ohio lost 42% of its tool and die workers, the worst of any big state. A second government dataset puts the drop at 19% and shows Ohio doing no worse than its neighbors. Ohio only looks hardest hit in the one measure we happened to use, and that measure is the noisier of the two available.", "next_step": "Stop outreach. The 46-contact list and the frozen data stay usable. If we want a piece from this research later, build it on shop closures instead, where the government's own records are consistent and the finding holds."}}</script>
<script>
const DOC = JSON.parse(document.getElementById('doc').textContent);
const LANES = {"browser": "Browser only", "terminal": "Terminal", "judgment": "Read and judge"};
const KEY = 'linkbait-audit:' + (DOC.asset && DOC.asset.slug ? DOC.asset.slug : 'unnamed');
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function field(label, value, cls) {
  if (!value) return '';
  return `<div class="field ${cls || ''}"><b>${esc(label)}</b>${esc(value)}</div>`;
}

function renderCheck(c) {
  const st = (state.checks && state.checks[c.id]) || {};
  const links = (c.links || []).filter(l => l.url).map(l =>
    `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || l.url)}</a></li>`).join('');
  let table = '';
  if (c.table) {
    const cols = (c.table.columns || []).map(x => `<th>${esc(x)}</th>`).join('');
    const rows = (c.table.rows || []).map(r => '<tr>' + r.map(cell =>
      (cell && typeof cell === 'object')
        ? `<td><a href="${esc(cell.url)}" target="_blank" rel="noopener">${esc(cell.text)}</a></td>`
        : `<td>${esc(cell)}</td>`).join('') + '</tr>').join('');
    table = `<div class="scroll"><table><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  let cmd = '';
  if (c.command) {
    cmd = `<div class="field"><b>Run this</b>
      <button class="copy" data-copy="${esc(c.command)}">Copy command</button>
      <pre>${esc(c.command)}</pre>
      ${c.expected ? `<span class="mono">Expected: ${esc(c.expected)}</span>` : ''}</div>`;
  }
  return `<div class="check" id="chk-${esc(c.id)}" data-lane="${esc(c.lane)}" data-state="${esc(st.verdict || '')}">
    <div class="check-head">
      <span class="cid">${esc(c.id)}</span>
      <span class="ctitle">${esc(c.title)}</span>
      <span class="chip">${esc(LANES[c.lane])}</span>
      <span class="chip">${esc(c.minutes || 5)} min</span>
    </div>
    ${field('Where to look', c.where)}
    ${links ? `<ul class="links">${links}</ul>` : ''}
    ${table}
    ${cmd}
    ${field('What to do', c.do)}
    ${field('Passing looks like', c.pass, 'pass')}
    ${field('Failing looks like', c.fail, 'fail')}
    ${c.note ? `<p class="mono" style="color:var(--muted)">${esc(c.note)}</p>` : ''}
    <div class="verdict" data-check="${esc(c.id)}">
      <button class="vbtn" data-v="pass" aria-pressed="${st.verdict === 'pass'}">Passed</button>
      <button class="vbtn" data-v="fail" aria-pressed="${st.verdict === 'fail'}">Problem found</button>
      <button class="vbtn" data-v="na" aria-pressed="${st.verdict === 'na'}">Not applicable</button>
    </div>
    <textarea data-note="${esc(c.id)}" placeholder="Notes, and what you actually saw (required if you found a problem)">${esc(st.note || '')}</textarea>
  </div>`;
}

function render() {
  const a = DOC.asset || {};
  const checks = DOC.checks || [];
  const risks = DOC.how_this_could_be_wrong || [];
  const lbn = a.load_bearing_number || null;
  const counts = {}, mins = {};
  checks.forEach(c => { counts[c.lane] = (counts[c.lane] || 0) + 1; mins[c.lane] = (mins[c.lane] || 0) + (c.minutes || 5); });

  let sections = '', current = null;
  checks.forEach(c => {
    if (c.section !== current) { current = c.section; sections += `<h3 data-section>${esc(current)}</h3>`; }
    sections += renderCheck(c);
  });

  const so = state.signoff || {};
  document.getElementById('app').innerHTML = `
    <h1>Audit package: ${esc(a.title || 'Untitled study')}</h1>
    <p class="sub"><b>${esc(a.client || 'Client not recorded')}</b> &middot; asset built ${esc(a.built || 'date not recorded')}
      ${a.page ? ` &middot; <a href="${esc(a.page)}" target="_blank" rel="noopener">open the page</a>` : ''}
      ${a.money_page ? ` &middot; <a href="${esc(a.money_page)}" target="_blank" rel="noopener">money page it feeds</a>` : ''}</p>
    <div class="banner">This asset does not go live and does not go into outreach until someone signs off at the
      bottom of this page. You are not checking our arithmetic. You are trying to find the thing that would
      embarrass us if a reporter found it first. Your progress saves in this browser.</div>

    ${(() => { const c = DOC.confidence; if (!c) return '';
      const V = {'proceed':'#0a7c42','proceed after fixes':'#b26a00','change the angle':'#b26a00','do not proceed':'#b3261e'};
      const rec = String(c.recommendation||'?'), vc = V[rec.toLowerCase()] || '#555';
      return `<h2>Recommendation</h2>
      <div class="card" style="border-left:6px solid ${vc}">
        <p style="margin:0;font-size:2.4em;font-weight:800;line-height:1.1;color:${vc}">${esc(rec.toUpperCase())}</p>
        ${c.why?`<p style="margin:14px 0 0;font-size:1.1em"><b>Why.</b> ${esc(c.why)}</p>`:''}
        ${c.next_step?`<p style="margin:8px 0 0;font-size:1.1em"><b>Next step.</b> ${esc(c.next_step)}</p>`:''}
        <p style="margin:14px 0 0;color:#666"><i>Everything below is the evidence for that call.
        Read on only if you want to check it.</i></p>
      </div>`; })()}

    <h2>Start here</h2>
    <div class="card"><b>What the study claims</b><p style="margin-top:6px">${esc(a.one_paragraph || 'Not recorded.')}</p></div>
    ${lbn ? `<div class="card">
      <b>The number everything rests on</b>
      <p class="big" style="margin:8px 0 4px">${esc(lbn.value)}</p>
      <dl class="kv">
        <dt>What it is</dt><dd>${esc(lbn.label)}</dd>
        <dt>Comes from</dt><dd class="mono">${esc(lbn.field)}</dd>
        <dt>Built from</dt><dd>${esc(lbn.source)}</dd>
      </dl>
      <p style="margin:10px 0 0;color:var(--muted);font-size:14.5px">If this is wrong, the whole piece is wrong. Check it first.</p>
    </div>` : ''}

    ${risks.length ? `<h2>How this could be wrong</h2>
      <p class="sub">Written by the people who built it. Each one is a real weakness, not a disclaimer. Decide whether the defence holds.</p>
      ${risks.map(r => `<div class="card risk"><b>${esc(r.risk)}</b>
        <p>Why we think it holds: ${esc(r.why_we_think_it_holds)}${r.check ? ` Test it in <a href="#chk-${esc(r.check)}">${esc(r.check)}</a>.` : ''}</p></div>`).join('')}` : ''}

    ${(() => { const c = DOC.confidence; if (!c) return '';
      const M = {check:['OK','#0a7c42'], part:['PARTIAL','#b26a00'], fail:['FAIL','#b3261e']};
      const li = (k,t) => (c[k]||[]).length ? `<p style="margin:16px 0 6px"><b>${t}</b></p><ul style="margin:0 0 4px 18px">${c[k].map(x=>`<li style="margin-bottom:4px">${esc(x)}</li>`).join('')}</ul>` : '';
      const fixes = c.fix_list||[];
      return `<h2>What we checked, and what we found</h2>
      <div class="card">
        <p style="margin:0 0 10px;color:#444">One question only: would someone outside the agency, using the same
        public data, find a plain factual error? Not whether they would have told the story differently.</p>
        <table style="width:100%;border-collapse:collapse">
        ${(c.dimensions||[]).map(d=>{const m=M[d.mark]||['?','#555'];return `<tr>
          <td style="padding:6px 10px 6px 0;white-space:nowrap;font-weight:700;color:${m[1]};vertical-align:top">${m[0]}</td>
          <td style="padding:6px 10px 6px 0;white-space:nowrap;vertical-align:top"><b>${esc(d.name||'')}</b></td>
          <td style="padding:6px 0;color:#444">${esc(d.note||'')}</td></tr>`;}).join('')}
        </table>
        <p style="margin:8px 0 0;color:#666">One FAIL is enough to stop a piece, so this is not a score out of five.</p>
        ${li('critic_could_land','What someone could catch us on')}
        ${fixes.length?`<p style="margin:16px 0 6px"><b>What it would take to fix</b></p><ol style="margin:0 0 4px 20px">${fixes.map(f=>`<li style="margin-bottom:8px"><b>${esc(f.what||'')}</b>${(f.effort||f.unlocks)?`<br><span style="color:#666">${f.effort?`About ${esc(f.effort)}`:''}${(f.effort&&f.unlocks)?'. ':''}${f.unlocks?`Fixes: ${esc(f.unlocks)}`:''}.</span>`:''}</li>`).join('')}</ol>`:''}
        <p style="margin:12px 0 0;color:#666"><i>Part of your sign-off is saying whether you agree with the recommendation above.</i></p>
      </div>`; })()}

    <h2>The checks</h2>
    <div class="scroll"><table>
      <thead><tr><th>Lane</th><th>Checks</th><th>Rough time</th><th>Who can do it</th></tr></thead>
      <tbody>
        <tr><td>Browser only</td><td>${counts.browser || 0}</td><td>${mins.browser || 0} min</td><td>Anyone</td></tr>
        <tr><td>Read and judge</td><td>${counts.judgment || 0}</td><td>${mins.judgment || 0} min</td><td>Anyone with SEO context</td></tr>
        <tr><td>Terminal</td><td>${counts.terminal || 0}</td><td>${mins.terminal || 0} min</td><td>Someone who can paste a command</td></tr>
      </tbody>
    </table></div>
    <p class="sub">The lanes are independent. Split them across people if that is easier.</p>

    <div class="tabs" id="tabs">
      <button class="tab" data-lane="all" aria-pressed="true">All</button>
      <button class="tab" data-lane="browser" aria-pressed="false">Browser only</button>
      <button class="tab" data-lane="judgment" aria-pressed="false">Read and judge</button>
      <button class="tab" data-lane="terminal" aria-pressed="false">Terminal</button>
      <span class="progress" id="progress"></span>
    </div>
    ${sections}

    <h2>Sign-off</h2>
    <div class="card signoff">
      <label>Reviewer name<input type="text" id="so-name" value="${esc(so.name || '')}"></label>
      <label style="display:block;margin-top:10px">Date reviewed<input type="text" id="so-date" placeholder="YYYY-MM-DD" value="${esc(so.date || '')}"></label>
      <div class="verdict" data-signoff>
        <button class="vbtn" data-v="pass" aria-pressed="${so.verdict === 'pass'}">Ship it</button>
        <button class="vbtn" data-v="na" aria-pressed="${so.verdict === 'na'}">Ship after fixes</button>
        <button class="vbtn" data-v="fail" aria-pressed="${so.verdict === 'fail'}">Do not ship</button>
      </div>
      <label style="display:block;margin-top:12px"><b>Blocking issues</b> (must change before this goes out)
        <textarea id="so-blocking">${esc(so.blocking || '')}</textarea></label>
      <label style="display:block;margin-top:10px"><b>Non-blocking notes</b>
        <textarea id="so-notes">${esc(so.notes || '')}</textarea></label>
      <div class="actions">
        <button class="vbtn primary" id="copy-report">Copy the report</button>
        <button class="vbtn" id="reset">Clear my answers</button>
      </div>
    </div>
    <footer>Generated by build_audit.py from checks.json and findings.json. Do not edit this file by hand: edit
      checks.json and rebuild, or the audit and the study drift apart.</footer>`;

  wire();
  updateProgress();
  applyLane(state.lane || 'all');
}

function wire() {
  document.querySelectorAll('[data-check] .vbtn').forEach(b => b.onclick = () => {
    const id = b.closest('[data-check]').dataset.check;
    state.checks = state.checks || {};
    const cur = state.checks[id] || {};
    cur.verdict = cur.verdict === b.dataset.v ? '' : b.dataset.v;
    state.checks[id] = cur; save();
    b.closest('.verdict').querySelectorAll('.vbtn').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === cur.verdict));
    document.getElementById('chk-' + id).dataset.state = cur.verdict || '';
    updateProgress();
  });
  document.querySelectorAll('[data-note]').forEach(t => t.oninput = () => {
    const id = t.dataset.note;
    state.checks = state.checks || {};
    state.checks[id] = Object.assign({}, state.checks[id], { note: t.value }); save();
  });
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    navigator.clipboard.writeText(b.dataset.copy).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy command', 1400); });
  });
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => { state.lane = b.dataset.lane; save(); applyLane(b.dataset.lane); });
  document.querySelectorAll('[data-signoff] .vbtn').forEach(b => b.onclick = () => {
    state.signoff = state.signoff || {};
    state.signoff.verdict = state.signoff.verdict === b.dataset.v ? '' : b.dataset.v; save();
    document.querySelectorAll('[data-signoff] .vbtn').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === state.signoff.verdict));
  });
  [['so-name', 'name'], ['so-date', 'date'], ['so-blocking', 'blocking'], ['so-notes', 'notes']].forEach(([id, k]) => {
    const el = document.getElementById(id);
    el.oninput = () => { state.signoff = Object.assign({}, state.signoff, { [k]: el.value }); save(); };
  });
  document.getElementById('reset').onclick = () => {
    if (confirm('Clear every answer on this page?')) { state = {}; save(); render(); }
  };
  document.getElementById('copy-report').onclick = () => navigator.clipboard.writeText(report()).then(() => alert('Report copied. Paste it wherever it needs to go.'));
}

function applyLane(lane) {
  document.querySelectorAll('#tabs .tab').forEach(b => b.setAttribute('aria-pressed', b.dataset.lane === lane));
  document.querySelectorAll('.check').forEach(el => el.classList.toggle('hidden', lane !== 'all' && el.dataset.lane !== lane));
  document.querySelectorAll('[data-section]').forEach(h => {
    let n = h.nextElementSibling, any = false;
    while (n && n.classList.contains('check')) { if (!n.classList.contains('hidden')) any = true; n = n.nextElementSibling; }
    h.classList.toggle('hidden', !any);
  });
}

function updateProgress() {
  const total = (DOC.checks || []).length;
  const done = Object.values(state.checks || {}).filter(c => c.verdict).length;
  const bad = Object.values(state.checks || {}).filter(c => c.verdict === 'fail').length;
  document.getElementById('progress').textContent = `${done} of ${total} answered${bad ? `, ${bad} problem${bad > 1 ? 's' : ''} found` : ''}`;
}

function report() {
  const a = DOC.asset || {}, so = state.signoff || {}, cs = state.checks || {};
  const verdictWord = { pass: 'Ship it', na: 'Ship after fixes', fail: 'Do not ship' }[so.verdict] || 'No verdict recorded';
  const lines = [
    `# Audit result: ${a.title || 'Untitled study'}`, '',
    `Client: ${a.client || 'not recorded'}`,
    `Reviewer: ${so.name || 'NOT SIGNED'}`,
    `Date: ${so.date || 'not recorded'}`,
    `Verdict: ${verdictWord}`, '',
  ];
  const fails = (DOC.checks || []).filter(c => (cs[c.id] || {}).verdict === 'fail');
  if (fails.length) {
    lines.push('## Problems found', '');
    fails.forEach(c => lines.push(`- **${c.id} ${c.title}** — ${(cs[c.id] || {}).note || 'no note left'}`));
    lines.push('');
  }
  const skipped = (DOC.checks || []).filter(c => !(cs[c.id] || {}).verdict);
  if (skipped.length) lines.push(`## Not checked`, '', skipped.map(c => `- ${c.id} ${c.title}`).join('\n'), '');
  if (so.blocking) lines.push('## Blocking issues', '', so.blocking, '');
  if (so.notes) lines.push('## Non-blocking notes', '', so.notes, '');
  const withNotes = (DOC.checks || []).filter(c => (cs[c.id] || {}).note && (cs[c.id] || {}).verdict !== 'fail');
  if (withNotes.length) {
    lines.push('## Reviewer notes on passing checks', '');
    withNotes.forEach(c => lines.push(`- **${c.id}** — ${cs[c.id].note}`));
  }
  return lines.join('\n');
}

render();
</script>
</body>
